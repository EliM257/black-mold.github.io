<html>
  <head>
    <title>Black Mold</title>
  </head>
  <body>
    <h1 id="elapsed">00:00:00</h1>

    <script>
      const display = document.getElementById("elapsed");
      const start = Date.now();

      function tick() {
        const total = Math.floor((Date.now() - start) / 1000);
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor(total / 60);
        const seconds = total % 60;

        display.textContent = `${hours}:${String(minutes).padstart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
