<html>
  <head>
    <title>Black Mold</title>
  </head>
  <body>
  <h1 id="timer">0</h1>

  <script>
    let seconds = tick;
    let intervalId = null;
    const display = document.getElementById("timer");

    function tick() {
      seconds++;
      display.textContent = seconds;
      intervalId = setInterval(tick, 1000);
    }
  
  </script>
  </body>
</html>
